<script>
function applyFilters() {
    filtrarNoticias();
    ordenarNoticias();
}

function clearAllFilters() {

  document.getElementById("thesisSearch").value = ""
  document.getElementById("orden").value = "recientes"

  applyFilters()

}

function filtrarNoticias() {

  const texto = document
    .getElementById("thesisSearch")
    .value
    .toLowerCase()

  const noticias = document.querySelectorAll(".noticia")

  noticias.forEach(noticia => {

    const contenido = noticia.textContent.toLowerCase()

    if (contenido.includes(texto)) {
      noticia.style.display = ""
    } else {
      noticia.style.display = "none"
    }

  })

}
function ordenarNoticias() {

  const orden = document.getElementById("orden").value;

  const grid = document.getElementById("thesisGrid");

  const cards = Array.from(grid.getElementsByClassName("noticia"));

  cards.sort((a,b) => {

    const fechaA = new Date(a.dataset.fecha);
    const fechaB = new Date(b.dataset.fecha);

    if (orden === "recientes") {
      return fechaB - fechaA;
    }

    return fechaA - fechaB;

  });

  cards.forEach(card => grid.appendChild(card));

}

document.addEventListener("DOMContentLoaded", () => {

  applyFilters()

  document.querySelectorAll(".noticia").forEach(card => {

    const boton = card.querySelector(".leer-mas-btn")

    boton.addEventListener("click", (e) => {

      e.stopPropagation()

      card.classList.toggle("abierta")

      if (card.classList.contains("abierta")) {
        boton.textContent = "Leer menos"
      } else {
        boton.textContent = "Leer más"
      }

    })

  })

})

</script>
