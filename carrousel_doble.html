<div class="carrousel-doble" >
    <div class ="noticias-bloque"
        data-config='{
       "slides":[
       {"img": "https://frba.utn.edu.ar/wp-content/uploads/2025/03/Banner-BECAS.png", "link": "https://frba.utn.edu.ar/investigacion/becas-de-investigacion/"},
        {"img": "https://frba.utn.edu.ar/wp-content/uploads/2025/03/Banner-BECAS.png", "link": "https://frba.utn.edu.ar/investigacion/becas-de-investigacion/"}
       ]
     }'>
        <h1><b>Noticias</b></h1>
        <div class="foto-carrousel">
            <div class="foto-track"></div>
            <div class="dots" ></div>
        </div>
        <a class="boton" href="https://b24-oflzi3.bitrix24.site/">Ver todas las Noticias</a>


    </div>
    <div class="projectos-bloque">
        <h1><b>Proyectos 2026</b></h1>
        <a href="https://giar.ai/proyectos/emptytemplate_hcys/" class="proyecto-link">
            <img src="https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/menu_projectos_perspectiva.png" alt="portada_menu" >
            <div class="overlay">Ver Proyectos</div>
        </a>
    </div>
</div>



<script>
document.addEventListener("DOMContentLoaded", function() {

  document.querySelectorAll(".noticias-bloque").forEach(function(wrapper){

    const data = JSON.parse(wrapper.dataset.config);
    const track = wrapper.querySelector(".foto-track");
    const dotsContainer = wrapper.querySelector(".dots");

    let i = 0;

    data.slides.forEach(function(slide, index){

      const image = document.createElement("img");
      image.src = slide.img;
      image.alt = "foto " + (index + 1);

      let container;

      if (slide.link) {
        const a = document.createElement("a");
        a.href = slide.link;
        a.classList.add("slide");

        const overlay = document.createElement("div");
        overlay.classList.add("overlay");
        overlay.textContent = "Leer más";

        a.appendChild(image);
        a.appendChild(overlay);

        container = a;
      } else {
        const div = document.createElement("div");
        div.classList.add("slide");
        div.appendChild(image);
        container = div;
      }

      track.appendChild(container);

      // crear dot
      const dot = document.createElement("span");
      dot.classList.add("dot");
      if(index === 0) dot.classList.add("active");

      dot.onclick = function(){
        i = index;
        update();
      }

      dotsContainer.appendChild(dot);
    });

    const dots = dotsContainer.querySelectorAll(".dot");
    const total = data.slides.length;

    function update(){
      track.style.transform = `translateX(-${i * 100}%)`;

      dots.forEach(d => d.classList.remove("active"));
      dots[i].classList.add("active");
    }

    // autoplay
    setInterval(function(){
      i = (i + 1) % total;
      update();
    }, 2000);

  });

});
</script>
