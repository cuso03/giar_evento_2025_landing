<div class="bloque-wrapper"
     data-config='{
       "titulo": " Panel de debate: IA, Estado, Industria y Educación",
       "subtitulo": "Este panel estratégico, moderado por la Ing. Laura Orfano (UTN-GIAR/Simbel), analizó la sinergia necesaria entre sectores para potenciar la competitividad nacional. Participaron Vanesa Gambirazio (ID4YOU/CACE) enfocada en e-commerce, el Ing. Sebastián Monsú (VENG/PROMTEAR) sobre datos aeroespaciales, el senador y economista Martín Lousteau sobre eficiencia pública y educación, la Ing. María Isabel Pariani (ReMASA) en innovación energética e Ignacio Alonso (CAME joven) sobre el futuro del trabajo. Junto a Leandro Di Matteo (GIAR), los expertos concluyeron que la articulación entre academia, sector privado y Estado es el pilar fundamental para liderar la transformación tecnológica en Argentina.",
       "descripcion": "",
       "fotos": [
          "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/9-Mirada sobre la inteligencia artificial/todos_mid_front.jpg",
"https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/9-Mirada sobre la inteligencia artificial/fotos_todos_con_lean_y_seba.jpg",
"https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/9-Mirada sobre la inteligencia artificial/lau_parada.jpg"
        ] 
        }'>

  <div class="bloque">
    <div class="box-texto">
      <h1 class="titulo"></h1>
      <h2 class="subtitulo"></h2>
      <p class="descripcion"></p>
    </div>

    <div class="foto-carrusel">
      <div class="foto-track"></div>
      <button class="ctrl left">❮</button>
      <button class="ctrl right">❯</button>
    </div>
  </div>

</div>
<script>

document.addEventListener("DOMContentLoaded", function() {

  document.querySelectorAll(".bloque-wrapper").forEach(function(wrapper){

    const data = JSON.parse(wrapper.dataset.config);
    const titulo = wrapper.querySelector(".titulo");
    const subtitulo = wrapper.querySelector(".subtitulo");
    const descripcion = wrapper.querySelector(".descripcion");
    const track = wrapper.querySelector(".foto-track");

    titulo.textContent = data.titulo;
    subtitulo.textContent = data.subtitulo;
    descripcion.textContent = data.descripcion || "";

    // Generar imágenes
    data.fotos.forEach(function(url, index){
      const img = document.createElement("img");
      img.src = url;
      img.alt = "foto" + (index+1);
      track.appendChild(img);
    });

    const total = data.fotos.length;
    let i = 0;

    

    function update(){
      track.style.transform = `translateX(-${i * 100}%)`;
    }
    wrapper.querySelector(".right").onclick = function(){
      i = (i + 1) % total;
      update();
    };

    wrapper.querySelector(".left").onclick = function(){
      i = (i - 1 + total) % total;
      update();
    };

  });

});
</script>
