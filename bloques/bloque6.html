<div class="bloque-wrapper"
     data-config='{
       "titulo": " De datos a decisiones: El viaje de la IA en el mantenimiento industrial",
       "subtitulo": "La Ing. Laura Beatriz Cabrera, especialista en desarrollo de negocios en Siemens, presentó cómo la inteligencia artificial transforma las fábricas mediante el mantenimiento predictivo. En su exposición, destacó la importancia de convertir los datos de sensores en información accionable para anticipar fallas y optimizar recursos. Su enfoque prioriza soluciones robustas y escalables que asistan al personal operativo sin requerir conocimientos avanzados en datos, impulsando así una industria más eficiente, segura y sustentable.",
       "descripcion": "",
       "fotos": [
              "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/6-De_Datos_a_decisiones_El_viaje_de_la_IA_en_el_mantenimiento_industrial/claudia_cabrera.jpg",
              "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/6-De_Datos_a_decisiones_El_viaje_de_la_IA_en_el_mantenimiento_industrial/claudia_cabrera_otro_lateral.jpg" ,
              "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/6-De_Datos_a_decisiones_El_viaje_de_la_IA_en_el_mantenimiento_industrial/claudia_cabrera_lejos.jpg"]
     }'>

  <div class="bloque">
  <div class="box-texto">
      <h1 class="titulo"></h1>
      <h2 class="subtitulo"></h2>
      <p class="descripcion"></p>
    </div>

    <div class="foto-carrusel">
      <div class="foto-track"></div>
      <button class="ctrl left">❮</button>
      <button class="ctrl right">❯</button>
    </div>
  </div>

</div>
<script>

document.addEventListener("DOMContentLoaded", function() {

  document.querySelectorAll(".bloque-wrapper").forEach(function(wrapper){

    const data = JSON.parse(wrapper.dataset.config);
    const titulo = wrapper.querySelector(".titulo");
    const subtitulo = wrapper.querySelector(".subtitulo");
    const descripcion = wrapper.querySelector(".descripcion");
    const track = wrapper.querySelector(".foto-track");

    titulo.textContent = data.titulo;
    subtitulo.textContent = data.subtitulo;
    descripcion.textContent = data.descripcion || "";

    // Generar imágenes
    data.fotos.forEach(function(url, index){
      const img = document.createElement("img");
      img.src = url;
      img.alt = "foto" + (index+1);
      track.appendChild(img);
    });

    const total = data.fotos.length;
    let i = 0;

    

    function update(){
      track.style.transform = `translateX(-${i * 100}%)`;
    }
    wrapper.querySelector(".right").onclick = function(){
      i = (i + 1) % total;
      update();
    };

    wrapper.querySelector(".left").onclick = function(){
      i = (i - 1 + total) % total;
      update();
    };

  });

});
</script>
<style>
  :root {
    --distance-bloque-titulo:20px;
    --distance-titulo-subtitulo:30px;
    /* Tipografías */
    --font-family: 'Red Hat Display', sans-serif;
    --font-titulo: 32px;
    --font-subtitulo: 28px;
    --font-descripcion: 18px;

    /* Colores */
    --color-titulo: #d3e7e7;
    --color-subtitulo: #d3e7e7;
    --color-descripcion: #d3e7e7;
    --color-fondo-box: #050505;
    --color-fondo-carrusel: #050505;
  }
.bloque {
  display: grid;
  grid-template-columns: 1fr 1.5fr;
  gap: 80px;
  width: 100%;
  max-width: 2000px;
  margin: 0 auto;
  padding-top: var(--distance-bloque-titulo);
  background: var(--color-fondo-carrusel);
  
}
/* TEXTO */
.box-texto {
  width: 100%;
  max-width: none;   /* eliminamos cualquier límite */
}

.box-texto h1 {
  font-family: var(--font-family);
  font-size: var(--font-titulo);
  font-weight: bold ;
  color:var(--color-titulo); 
  line-height: 1.1;
  
}

.box-texto h2 {
  font-family: var(--font-family);
  font-size: var(--font-subtitulo);
  color:var(--color-subtitulo); 
  line-height: 1.6;
  margin-top: var(--distance-titulo-subtitulo);
}
/* CARRUSEL */
.foto-carrusel {
  width: 100%;
  height: 820px;   /* grande real */
  overflow: hidden;
  aspect-ratio: 16/9 ; 
  position: relative;
  border-radius: 22px;
  background: var(--color-fondo-carrusel);
}

.foto-track {
  display: flex;
  height: 100%;
  transition: transform 0.5s ease;
}

.foto-track img {
  width: 100%;      /* 👈 mismo ancho que carrusel */
  height: 100%;
  object-fit: cover;
  flex-shrink: 0;
}

.ctrl {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: #1a043f;
  color: white;
  border: none;
  font-size: 22px;
  padding: 6px 12px;
  cursor: pointer;
  border-radius: 6px;
}
@media (max-width: 1100px) {
  .bloque {
    flex-direction: column;
  }

  .foto-carrusel {
    height: 480px;
    width: 100%;
  }
}


.ctrl.left { left: 10px; }
.ctrl.right { right: 10px; }

.bloque-wrapper {
  position: relative;
  width: 100vw;
  left: 50%;
  transform: translateX(-50%);
  background-color: var(--color-fondo-carrusel);
}
</style>
