<div class="bloque-wrapper"
     data-config='{
       "titulo": " Inteligencia Artificial para un planeta sostenible",
       "subtitulo": "Facundo Armas (Especialista en proyectos de innovación en Globant) analizó el rol de la IA como aliada estratégica frente a la crisis climática y los desafíos de sostenibilidad. Su presentación recorrió aplicaciones clave en mitigación y adaptación, desde la optimización de redes eléctricas y agricultura de precisión hasta la detección temprana de incendios forestales. Armas destacó que, si bien la IA es una herramienta poderosa para acelerar el impacto positivo, su adopción debe ser ética y consciente de su propio consumo energético para garantizar un desarrollo verdaderamente sostenible.",
       "descripcion": "",
       "fotos": [
          
"https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/12-Inteligencia Articifical para un planeta sostenible/facundo_de_armas_presentacion.jpg",
"https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/12-Inteligencia Articifical para un planeta sostenible/Facundo_de_Armas.jpg",
"https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/12-Inteligencia Articifical para un planeta sostenibles/facundo_de_armas_lejos.jpg"
        
         ] }'>

  <div class="bloque">
    <div class="box-texto">
      <h1 class="titulo"></h1>
      <h2 class="subtitulo"></h2>
      <p class="descripcion"></p>
    </div>

    <div class="foto-carrusel">
      <div class="foto-track"></div>
      <button class="ctrl left">❮</button>
      <button class="ctrl right">❯</button>
    </div>
  </div>

</div>
<script>

document.addEventListener("DOMContentLoaded", function() {

  document.querySelectorAll(".bloque-wrapper").forEach(function(wrapper){

    const data = JSON.parse(wrapper.dataset.config);
    const titulo = wrapper.querySelector(".titulo");
    const subtitulo = wrapper.querySelector(".subtitulo");
    const descripcion = wrapper.querySelector(".descripcion");
    const track = wrapper.querySelector(".foto-track");

    titulo.textContent = data.titulo;
    subtitulo.textContent = data.subtitulo;
    descripcion.textContent = data.descripcion || "";

    // Generar imágenes
    data.fotos.forEach(function(url, index){
      const img = document.createElement("img");
      img.src = url;
      img.alt = "foto" + (index+1);
      track.appendChild(img);
    });

    const total = data.fotos.length;
    let i = 0;

    

    function update(){
      track.style.transform = `translateX(-${i * 100}%)`;
    }
    wrapper.querySelector(".right").onclick = function(){
      i = (i + 1) % total;
      update();
    };

    wrapper.querySelector(".left").onclick = function(){
      i = (i - 1 + total) % total;
      update();
    };

  });

});
</script>
