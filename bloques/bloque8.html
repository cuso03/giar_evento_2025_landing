<div class="bloque-wrapper"
     data-config='{
       "titulo": "Explorando lo invisible: de los galeones hundidos a los datos ocultos",
       "subtitulo": "Mariano Boyadjian (Gerente de ATL de IBM para Argentina y Chile) presentó una innovadora analogía entre la exploración submarina de naufragios y el descubrimiento de conocimiento mediante IA. En su exposición, analizó la evolución desde la ciencia de datos tradicional hacia la Generative AI y la Agentic AI (agentes autónomos), detallando cómo el uso de arquitecturas RAG y bases de datos vectoriales permite a las organizaciones rescatar información crítica de entre datos dispersos. Su charla enfatizó la importancia de la gobernanza y la interpretación del contexto para transformar lo `invisible´ en valor estratégico.",
       "descripcion": "",
       "fotos": [
          "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/8-Explorando lo invisible de los galeones hundidos a los datos ocultos/mariano.jpg",
          "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/8-Explorando lo invisible de los galeones hundidos a los datos ocultos/mariano2.jpg",
          "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/8-Explorando lo invisible de los galeones hundidos a los datos ocultos/mariano_otra.jpg"] 
        }'>

  <div class="bloque">
    <div class="box-texto">
      <h1 class="titulo"></h1>
      <h2 class="subtitulo"></h2>
      <p class="descripcion"></p>
    </div>

    <div class="foto-carrusel">
      <div class="foto-track"></div>
      <button class="ctrl left">❮</button>
      <button class="ctrl right">❯</button>
    </div>
  </div>

</div>
<script>

document.addEventListener("DOMContentLoaded", function() {

  document.querySelectorAll(".bloque-wrapper").forEach(function(wrapper){

    const data = JSON.parse(wrapper.dataset.config);
    const titulo = wrapper.querySelector(".titulo");
    const subtitulo = wrapper.querySelector(".subtitulo");
    const descripcion = wrapper.querySelector(".descripcion");
    const track = wrapper.querySelector(".foto-track");

    titulo.textContent = data.titulo;
    subtitulo.textContent = data.subtitulo;
    descripcion.textContent = data.descripcion || "";

    // Generar imágenes
    data.fotos.forEach(function(url, index){
      const img = document.createElement("img");
      img.src = url;
      img.alt = "foto" + (index+1);
      track.appendChild(img);
    });

    const total = data.fotos.length;
    let i = 0;

    

    function update(){
      track.style.transform = `translateX(-${i * 100}%)`;
    }
    wrapper.querySelector(".right").onclick = function(){
      i = (i + 1) % total;
      update();
    };

    wrapper.querySelector(".left").onclick = function(){
      i = (i - 1 + total) % total;
      update();
    };

  });

});
</script>
