<div class="bloque-wrapper"
     data-config='{
       "titulo": " Agentes y Gemelos Digitales con IA",
       "subtitulo": "El Mgter. Leandro Di Matteo (Codirector del GIAR) y la Ing. Laura Orfano (Investigadora del GIAR y CEO de Simbel) presentaron el desarrollo de gemelos digitales diseñados para emular la voz, imagen y conocimiento de docentes y profesionales. Este proyecto pionero de la UTN.BA busca transformar la educación mediante un acompañamiento personalizado 24/7, logrando una mayor cercanía y efectividad en el aprendizaje que los chatbots convencionales. La exposición destacó cómo esta tecnología humaniza la interacción virtual, permitiendo escalar el conocimiento experto a entornos académicos y corporativos.",
       "descripcion": "",
       "fotos": [
          
"https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/13-Agentes y Gemelos Digitales con Inteligencia Atificial/lean_y_lau.jpg",
"https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/13-Agentes y Gemelos Digitales con Inteligencia Atificial/lean_front.jpg",
"https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/13-Agentes y Gemelos Digitales con Inteligencia Atificial/laura_front.jpg"
          
         ] }'>

  <div class="bloque">
    <div class="box-texto">
      <h1 class="titulo"></h1>
      <h2 class="subtitulo"></h2>
      <p class="descripcion"></p>
    </div>

    <div class="foto-carrusel">
      <div class="foto-track"></div>
      <button class="ctrl left">❮</button>
      <button class="ctrl right">❯</button>
    </div>
  </div>

</div>
<script>

document.addEventListener("DOMContentLoaded", function() {

  document.querySelectorAll(".bloque-wrapper").forEach(function(wrapper){

    const data = JSON.parse(wrapper.dataset.config);
    const titulo = wrapper.querySelector(".titulo");
    const subtitulo = wrapper.querySelector(".subtitulo");
    const descripcion = wrapper.querySelector(".descripcion");
    const track = wrapper.querySelector(".foto-track");

    titulo.textContent = data.titulo;
    subtitulo.textContent = data.subtitulo;
    descripcion.textContent = data.descripcion || "";

    // Generar imágenes
    data.fotos.forEach(function(url, index){
      const img = document.createElement("img");
      img.src = url;
      img.alt = "foto" + (index+1);
      track.appendChild(img);
    });

    const total = data.fotos.length;
    let i = 0;

    

    function update(){
      track.style.transform = `translateX(-${i * 100}%)`;
    }
    wrapper.querySelector(".right").onclick = function(){
      i = (i + 1) % total;
      update();
    };

    wrapper.querySelector(".left").onclick = function(){
      i = (i - 1 + total) % total;
      update();
    };

  });

});
</script>
