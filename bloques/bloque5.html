<div class="bloque-wrapper"
     data-config='{
       "titulo": "  Inteligencia artificial y la evolución de los servicios",
       "subtitulo": "Tomás Bianco (Senior Manager en Accenture) analizó cómo la inteligencia artificial redefine los modelos de negocio, migrando de sistemas rígidos hacia servicios inmediatos y personalizados. En su exposición, destacó a la IA como un `copiloto´ esencial para potenciar la productividad humana y la toma de decisiones, enfatizando la importancia del uso ético de los datos y el cambio cultural necesario para integrar estas tecnologías de forma responsable en las organizaciones actuales.",
       "descripcion": "",
       "fotos": [ "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/5-Inteligencia Artificial y la evolución de los servicios/tomas_bianco_cerca_abajo.jpg",
        "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/5-Inteligencia Artificial y la evolución de los servicios/tomas_bianco_lateral.jpg",
        "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/5-Inteligencia Artificial y la evolución de los servicios/tomi_bianco_de_mid.jpg" 
     ]
     }'>

  <div class="bloque">
    <div class="box-texto">
      <h1 class="titulo"></h1>
      <h2 class="subtitulo"></h2>
      <p class="descripcion"></p>
    </div>

    <div class="foto-carrusel">
      <div class="foto-track"></div>
      <button class="ctrl left">❮</button>
      <button class="ctrl right">❯</button>
    </div>
  </div>

</div>
<script>

document.addEventListener("DOMContentLoaded", function() {

  document.querySelectorAll(".bloque-wrapper").forEach(function(wrapper){

    const data = JSON.parse(wrapper.dataset.config);
    const titulo = wrapper.querySelector(".titulo");
    const subtitulo = wrapper.querySelector(".subtitulo");
    const descripcion = wrapper.querySelector(".descripcion");
    const track = wrapper.querySelector(".foto-track");

    titulo.textContent = data.titulo;
    subtitulo.textContent = data.subtitulo;
    descripcion.textContent = data.descripcion || "";

    // Generar imágenes
    data.fotos.forEach(function(url, index){
      const img = document.createElement("img");
      img.src = url;
      img.alt = "foto" + (index+1);
      track.appendChild(img);
    });

    const total = data.fotos.length;
    let i = 0;

    

    function update(){
      track.style.transform = `translateX(-${i * 100}%)`;
    }
    wrapper.querySelector(".right").onclick = function(){
      i = (i + 1) % total;
      update();
    };

    wrapper.querySelector(".left").onclick = function(){
      i = (i - 1 + total) % total;
      update();
    };

  });

});
</script>
