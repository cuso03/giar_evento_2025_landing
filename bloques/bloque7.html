<div class="bloque-wrapper"
     data-config='{
       "titulo": " Robótica autónoma de inspección: El nuevo paradigma en la confiabilidad industrial",
       "subtitulo": "Aníbal Suárez Schmitz (CEO de GEniA), ingeniero especialista en mantenimiento y ensayos, expuso cómo la robótica autónoma y la IA transforman la confiabilidad en las plantas productivas. Presentó soluciones de monitoreo en tiempo real que permiten detectar fallas críticas, optimizar costos y elevar los estándares de seguridad operativa. Su intervención destacó casos globales de éxito y la importancia de la formación profesional en áreas STEM para liderar la evolución tecnológica en la industria.",
       "descripcion": "",
       "fotos": [
         "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/7-Robótica Autónoma de Inspección_ El Nuevo paradigma en Confiabilidad Industrial/anibal_mid_front.jpg",
"https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/7-Robótica Autónoma de Inspección_ El Nuevo paradigma en Confiabilidad Industrial/anibal_lateral_mid.jpg",
"https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/7-Robótica Autónoma de Inspección_ El Nuevo paradigma en Confiabilidad Industrial/anibal_lejos.jpg" ]
 }'>

  <div class="bloque">
    <div class="box-texto">
      <h1 class="titulo"></h1>
      <h2 class="subtitulo"></h2>
      <p class="descripcion"></p>
    </div>

    <div class="foto-carrusel">
      <div class="foto-track"></div>
      <button class="ctrl left">❮</button>
      <button class="ctrl right">❯</button>
    </div>
  </div>

</div>
<script>

document.addEventListener("DOMContentLoaded", function() {

  document.querySelectorAll(".bloque-wrapper").forEach(function(wrapper){

    const data = JSON.parse(wrapper.dataset.config);
    const titulo = wrapper.querySelector(".titulo");
    const subtitulo = wrapper.querySelector(".subtitulo");
    const descripcion = wrapper.querySelector(".descripcion");
    const track = wrapper.querySelector(".foto-track");

    titulo.textContent = data.titulo;
    subtitulo.textContent = data.subtitulo;
    descripcion.textContent = data.descripcion || "";

    // Generar imágenes
    data.fotos.forEach(function(url, index){
      const img = document.createElement("img");
      img.src = url;
      img.alt = "foto" + (index+1);
      track.appendChild(img);
    });

    const total = data.fotos.length;
    let i = 0;

    

    function update(){
      track.style.transform = `translateX(-${i * 100}%)`;
    }
    wrapper.querySelector(".right").onclick = function(){
      i = (i + 1) % total;
      update();
    };

    wrapper.querySelector(".left").onclick = function(){
      i = (i - 1 + total) % total;
      update();
    };

  });

});
</script>
