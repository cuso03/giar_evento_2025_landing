<div class="bloque-wrapper"
     data-config='{
       "titulo": " Bienvenida / Apertura del GIAR AI & Robotics 2025",
       "subtitulo": "La jornada inició con Alejandra Vásquez (UTN.BA) y los directores del GIAR, Sebastián Verrastro y Leandro Di Matteo, quienes repasaron los 39 años del grupo liderando proyectos de IA, robótica móvil y modelos de lenguaje (LLM). El bloque cerró con la Lic. Patricia Cibeira (Secretaría de CyT) y el Ing. Guillermo Oliveto (Decano de la UTN.BA), quienes destacaron el impacto de los más de 40 proyectos de investigación del GIAR y su rol estratégico en la transferencia tecnológica entre la universidad y la industria argentina.",
       "descripcion": "",
       "fotos": [
         "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/1-Bienvenida/Directores_GIAR.jpg",
         "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/1-Bienvenida/septic_y_decano_.jpg",
         "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/1-Bienvenida/video.jpg"
       ]
     }'>

  <div class="bloque">
    <div class="box-texto">
      <h1 class="titulo"></h1>
      <h2 class="subtitulo"></h2>
      <p class="descripcion"></p>
    </div>

    <div class="foto-carrusel">
      <div class="foto-track"></div>
      <button class="ctrl left">❮</button>
      <button class="ctrl right">❯</button>
    </div>
  </div>

</div>
<script>

document.addEventListener("DOMContentLoaded", function() {

  document.querySelectorAll(".bloque-wrapper").forEach(function(wrapper){

    const data = JSON.parse(wrapper.dataset.config);
    const titulo = wrapper.querySelector(".titulo");
    const subtitulo = wrapper.querySelector(".subtitulo");
    const descripcion = wrapper.querySelector(".descripcion");
    const track = wrapper.querySelector(".foto-track");

    titulo.textContent = data.titulo;
    subtitulo.textContent = data.subtitulo;
    descripcion.textContent = data.descripcion || "";

    // Generar imágenes
    data.fotos.forEach(function(url, index){
      const img = document.createElement("img");
      img.src = url;
      img.alt = "foto" + (index+1);
      track.appendChild(img);
    });

    const total = data.fotos.length;
    let i = 0;

    

    function update(){
      track.style.transform = `translateX(-${i * 100}%)`;
    }
    wrapper.querySelector(".right").onclick = function(){
      i = (i + 1) % total;
      update();
    };

    wrapper.querySelector(".left").onclick = function(){
      i = (i - 1 + total) % total;
      update();
    };

  });

});
</script>
<style>
  :root {

    --font-family: 'Red Hat Display', sans-serif;

    --color-fondo-carrusel: #050505;
  }
 {
  box-sizing: border-box;
 }

  max-width: 1300px;   /* Para que no se estire demasiado en monitores grandes */
  margin: 0 auto;      /* Centra el bloque */
  align-items: start;  /* Alinea el texto arriba para que no se pierda */
}
/* TEXTO */
.box-texto {
  width: 100% !important; /* QUITAMOS el 80vw. Ahora usa el 100% de su columna (el 40%) */
  padding-left: 20px;    /* Esto garantiza que el texto NUNCA toque el borde izquierdo */
  color: var(--color-descripcion);
}

  font-size: var(--font-titulo);

}

.box-texto h2 {
  font-family: var(--font-family);

  color:var(--color-subtitulo); 
  line-height: 1.6;
  margin-top: var(--distance-titulo-subtitulo);
}
/* CARRUSEL */
.foto-carrusel {
  width: 100% !important; /* QUITAMOS el 70vw. Ahora usa su columna (el 60%) */
  height: auto;
  aspect-ratio: 16 / 9;

  border-radius: 22px;
  overflow: hidden;

}

  display: flex;

  transition: transform 0.5s ease;
}

.foto-track img {
  width: 100%;

  object-fit: cover;
}

.ctrl {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: #1a043f;
  color: white;
  border: none;
  font-size: 22px;

}
/* --- AJUSTE PARA MÓVILES --- */
@media (max-width: 1100px) {
  /* Forzar orden vertical */

    display: flex !important;

  .box-texto {

  }

  }

</style>
