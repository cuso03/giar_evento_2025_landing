<div class="bloque-wrapper"
     data-config='{
       "titulo": " El cinco en la cancha y en las organizaciones: Orquestar con IA",
       "subtitulo": "Diego Martínez (Enterprise Architect en Salesforce) utilizó la metáfora del `cinco´ en el fútbol para explicar el rol estratégico de la IA como orquestadora organizacional. En su charla, detalló cómo los CRM potenciados por agentes autónomos permiten romper silos operativos, coordinando áreas como ventas, marketing y atención al cliente en tiempo real. A través de casos prácticos en finanzas y educación, Martínez demostró cómo esta `mediocampista digital´ anticipa necesidades y agiliza procesos complejos, permitiendo que las empresas operen con fluidez y brinden experiencias personalizadas sin fricciones.",
       "descripcion": "",
       "fotos": [
          
"https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/11-El 5 dn la cancha... , y en las organizaciones/diego_fron.jpg",
"https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/11-El 5 dn la cancha... , y en las organizaciones/diego_lateral.jpg",
"https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/11-El 5 dn la cancha... , y en las organizaciones/diego_lejos.jpg" ] 
        }'>

  <div class="bloque">
    <div class="box-texto">
      <h1 class="titulo"></h1>
      <h2 class="subtitulo"></h2>
      <p class="descripcion"></p>
    </div>

    <div class="foto-carrusel">
      <div class="foto-track"></div>
      <button class="ctrl left">❮</button>
      <button class="ctrl right">❯</button>
    </div>
  </div>

</div>
<script>

document.addEventListener("DOMContentLoaded", function() {

  document.querySelectorAll(".bloque-wrapper").forEach(function(wrapper){

    const data = JSON.parse(wrapper.dataset.config);
    const titulo = wrapper.querySelector(".titulo");
    const subtitulo = wrapper.querySelector(".subtitulo");
    const descripcion = wrapper.querySelector(".descripcion");
    const track = wrapper.querySelector(".foto-track");

    titulo.textContent = data.titulo;
    subtitulo.textContent = data.subtitulo;
    descripcion.textContent = data.descripcion || "";

    // Generar imágenes
    data.fotos.forEach(function(url, index){
      const img = document.createElement("img");
      img.src = url;
      img.alt = "foto" + (index+1);
      track.appendChild(img);
    });

    const total = data.fotos.length;
    let i = 0;

    

    function update(){
      track.style.transform = `translateX(-${i * 100}%)`;
    }
    wrapper.querySelector(".right").onclick = function(){
      i = (i + 1) % total;
      update();
    };

    wrapper.querySelector(".left").onclick = function(){
      i = (i - 1 + total) % total;
      update();
    };

  });

});
</script>
