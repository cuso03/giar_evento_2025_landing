<div class="bloque-wrapper"
     data-config='{
       "titulo": "`Prohibido no promptear´: La IA como aliada creativa y estratégica ",
       "subtitulo": "Nelson Andrés Fuentes (Director Ejecutivo de Promtear y Fundador de AVIVATE) y Phillip Hausmann (Director de Hunter Consulting y Promptear.org) exploraron la IA como una compañera esencial en la toma de decisiones. Bajo la premisa `promptear no es pensar´, los especialistas advirtieron sobre el riesgo de la dependencia pasiva y propusieron el `pensamiento aumentado´: el uso de la IA como un `bisturí´ dirigido por el pensamiento crítico y la intención humana. Su charla destacó que el verdadero desafío no es solo usar la tecnología, sino liderarla con ética y criterio para convertirla en un motor de innovación con propósito.",
       "descripcion": "",
       "fotos": ["https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/10-Prohibido No Prom,ptear/nelson_y_phillip_inicio.jpg",
                "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/10-Prohibido No Prom,ptear/nelson_charla.jpg",
                "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/10-Prohibido No Prom,ptear/philip_charla.jpg" 
        ] 
        }'>

  <div class="bloque">
    <div class="box-texto">
      <h1 class="titulo"></h1>
      <h2 class="subtitulo"></h2>
      <p class="descripcion"></p>
    </div>

    <div class="foto-carrusel">
      <div class="foto-track"></div>
      <button class="ctrl left">❮</button>
      <button class="ctrl right">❯</button>
    </div>
  </div>

</div>
<script>

document.addEventListener("DOMContentLoaded", function() {

  document.querySelectorAll(".bloque-wrapper").forEach(function(wrapper){

    const data = JSON.parse(wrapper.dataset.config);
    const titulo = wrapper.querySelector(".titulo");
    const subtitulo = wrapper.querySelector(".subtitulo");
    const descripcion = wrapper.querySelector(".descripcion");
    const track = wrapper.querySelector(".foto-track");

    titulo.textContent = data.titulo;
    subtitulo.textContent = data.subtitulo;
    descripcion.textContent = data.descripcion || "";

    // Generar imágenes
    data.fotos.forEach(function(url, index){
      const img = document.createElement("img");
      img.src = url;
      img.alt = "foto" + (index+1);
      track.appendChild(img);
    });

    const total = data.fotos.length;
    let i = 0;

    

    function update(){
      track.style.transform = `translateX(-${i * 100}%)`;
    }
    wrapper.querySelector(".right").onclick = function(){
      i = (i + 1) % total;
      update();
    };

    wrapper.querySelector(".left").onclick = function(){
      i = (i - 1 + total) % total;
      update();
    };

  });

});
</script>
