<div class="bloque-wrapper"
     data-config='{
       "titulo": " Reconocimiento a Claudio Verrastro",
       "subtitulo": "El Mgter. Leandro Di Matteo encabezó un emotivo reconocimiento al Ing. Claudio Verrastro, quien fundó el GIAR en 1986. Acompañado por referentes históricos como Javier Reutman, Alex Peschanker y Rodrigo Alcoberro, se celebró su rol pionero en la UTN tras casi cuatro décadas de innovación. En su discurso, Verrastro reflexionó sobre la actual revolución de la inteligencia artificial, instando a las nuevas generaciones a liderar el desarrollo tecnológico con ética, sabiduría y responsabilidad social.",
       "descripcion": "",
       "fotos": [
         "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/4-Reconocimieto claudio verrastro/foto_todos.jpg",
"https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/4-Reconocimieto claudio verrastro/claudio_con_premio.jpg",
"https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/4-Reconocimieto claudio verrastro/palabras_claudio_verrastro.jpg"]
     }'>

  <div class="bloque">
    <div class="box-texto">
      <h1 class="titulo"></h1>
      <h2 class="subtitulo"></h2>
      <p class="descripcion"></p>
    </div>

    <div class="foto-carrusel">
      <div class="foto-track"></div>
      <button class="ctrl left">❮</button>
      <button class="ctrl right">❯</button>
    </div>
  </div>

</div>
<script>

document.addEventListener("DOMContentLoaded", function() {

  document.querySelectorAll(".bloque-wrapper").forEach(function(wrapper){

    const data = JSON.parse(wrapper.dataset.config);
    const titulo = wrapper.querySelector(".titulo");
    const subtitulo = wrapper.querySelector(".subtitulo");
    const descripcion = wrapper.querySelector(".descripcion");
    const track = wrapper.querySelector(".foto-track");

    titulo.textContent = data.titulo;
    subtitulo.textContent = data.subtitulo;
    descripcion.textContent = data.descripcion || "";

    // Generar imágenes
    data.fotos.forEach(function(url, index){
      const img = document.createElement("img");
      img.src = url;
      img.alt = "foto" + (index+1);
      track.appendChild(img);
    });

    const total = data.fotos.length;
    let i = 0;

    

    function update(){
      track.style.transform = `translateX(-${i * 100}%)`;
    }
    wrapper.querySelector(".right").onclick = function(){
      i = (i + 1) % total;
      update();
    };

    wrapper.querySelector(".left").onclick = function(){
      i = (i - 1 + total) % total;
      update();
    };

  });

});
</script>
