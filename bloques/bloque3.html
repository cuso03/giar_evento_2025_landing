<div class="bloque-wrapper"
     data-config='{
       "titulo": " Presentacion grupo GIAR",
       "subtitulo": "El Mgter. Leandro Di Matteo encabezó un panel junto a los ingenieros e investigadores Sergio Alberino, Pablo Folino, Lucas Liaño y Ramiro Colmeiro para exponer el ecosistema de innovación del GIAR. La presentación recorrió hitos desde las interfaces cerebro-computadora y la robótica móvil (Alberino), hasta el desarrollo de robots tetrápodos que aprenden a caminar mediante aprendizaje por refuerzo (Folino). Asimismo, se destacaron los avances en drones y tecnología aeroespacial vinculada a nanosatélites (Liaño), cerrando con aplicaciones de visión artificial en medicina y agroindustria, junto a la investigación en modelos de lenguaje (LLM) adaptados al español (Colmeiro).",
       "descripcion": "",
       "fotos": ["https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/3-Presentación Grupo Giar/living_todos.jpg",
                 "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/3-Presentación Grupo Giar/living_todos_mid.jpg",
                 "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/3-Presentación Grupo Giar/living_todos_lejos.jpg"
                  ]
     }'>

  <div class="bloque">
    <div class="box-texto">
      <h1 class="titulo"></h1>
      <h2 class="subtitulo"></h2>
      <p class="descripcion"></p>
    </div>

    <div class="foto-carrusel">
      <div class="foto-track"></div>
      <button class="ctrl left">❮</button>
      <button class="ctrl right">❯</button>
    </div>
  </div>

</div>
<script>

document.addEventListener("DOMContentLoaded", function() {

  document.querySelectorAll(".bloque-wrapper").forEach(function(wrapper){

    const data = JSON.parse(wrapper.dataset.config);
    const titulo = wrapper.querySelector(".titulo");
    const subtitulo = wrapper.querySelector(".subtitulo");
    const descripcion = wrapper.querySelector(".descripcion");
    const track = wrapper.querySelector(".foto-track");

    titulo.textContent = data.titulo;
    subtitulo.textContent = data.subtitulo;
    descripcion.textContent = data.descripcion || "";

    // Generar imágenes
    data.fotos.forEach(function(url, index){
      const img = document.createElement("img");
      img.src = url;
      img.alt = "foto" + (index+1);
      track.appendChild(img);
    });

    const total = data.fotos.length;
    let i = 0;

    

    function update(){
      track.style.transform = `translateX(-${i * 100}%)`;
    }
    wrapper.querySelector(".right").onclick = function(){
      i = (i + 1) % total;
      update();
    };

    wrapper.querySelector(".left").onclick = function(){
      i = (i - 1 + total) % total;
      update();
    };

  });

});
</script>
