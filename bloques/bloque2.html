
  <div class="bloque-wrapper"
     data-config='{
    "titulo":" Robótica Viva: La evolución que ya llegó",
    "subtitulo":"Nelson Andrés Fuentes (Director de Promptear y AVIVATE) y Franco Davicino (Product Manager en Big Dipper Technology) presentaron el impacto de la robótica autónoma en la seguridad y la industria actual. Con una demostración en vivo de los robots Go2 y el humanoide G1, explicaron cómo Big Dipper integra IA y teleoperación para tareas críticas, minimizando riesgos humanos en entornos peligrosos. La charla destacó además la apertura de la empresa para colaborar con la UTN en pasantías e investigación conjunta, fortaleciendo el vínculo estratégico entre la industria y la academia.",
          "descripcion": "",
    "fotos": [
          "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/2-Robotica_Viva/nelson_fuentes_y_franco_davicino_with_robots_2.jpg",
          "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/2-Robotica_Viva/nelson_fuentes_y_franco_davino_with_robots.jpg",
          "https://raw.githubusercontent.com/cuso03/giar_evento_2025_landing/main/giar_eventos/2-Robotica_Viva/franco_davicino_y_nelson%20_desde_lejos.jpg"
        ]
      }'>

  <div class="bloque">
    <div class="box-texto">
      <h1 class="titulo"></h1>
      <h2 class="subtitulo"></h2>
      <p class="descripcion"></p>
    </div>

    <div class="foto-carrusel">
      <div class="foto-track"></div>
      <button class="ctrl left">❮</button>
      <button class="ctrl right">❯</button>
    </div>
  </div>

</div>
<script>

document.addEventListener("DOMContentLoaded", function() {

  document.querySelectorAll(".bloque-wrapper").forEach(function(wrapper){

    const data = JSON.parse(wrapper.dataset.config);
    const titulo = wrapper.querySelector(".titulo");
    const subtitulo = wrapper.querySelector(".subtitulo");
    const descripcion = wrapper.querySelector(".descripcion");
    const track = wrapper.querySelector(".foto-track");

    titulo.textContent = data.titulo;
    subtitulo.textContent = data.subtitulo;
    descripcion.textContent = data.descripcion || "";

    // Generar imágenes
    data.fotos.forEach(function(url, index){
      const img = document.createElement("img");
      img.src = url;
      img.alt = "foto" + (index+1);
      track.appendChild(img);
    });

    const total = data.fotos.length;
    let i = 0;

    

    function update(){
      track.style.transform = `translateX(-${i * 100}%)`;
    }
    wrapper.querySelector(".right").onclick = function(){
      i = (i + 1) % total;
      update();
    };

    wrapper.querySelector(".left").onclick = function(){
      i = (i - 1 + total) % total;
      update();
    };

  });

});

</script>
